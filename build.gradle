plugins {
  id 'java'
  id 'war'
}

group 'ru.monyamau'
version '1.0'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.13.2'
  springVersion = '7.0.8'
  springDataVersion = '4.1.0'
  lombokVersion = '1.18.46'
}

sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

dependencies {
  providedCompile "jakarta.servlet:jakarta.servlet-api:6.1.0"

  runtimeOnly "com.mysql:mysql-connector-j:9.7.0"
  runtimeOnly "io.lettuce:lettuce-core:7.6.0.RELEASE"

  implementation "org.hibernate.orm:hibernate-core:7.4.4.Final"
  implementation "org.springframework:spring-webmvc:${springVersion}"
  implementation "org.springframework.data:spring-data-jpa:${springDataVersion}"
  implementation "org.springframework.data:spring-data-redis:${springDataVersion}"
  implementation "com.fasterxml.jackson.core:jackson-databind:2.22.1"

  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
useJUnitPlatform()}