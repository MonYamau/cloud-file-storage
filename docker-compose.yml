services:
  db:
    image: mysql:9.7
    container_name: cloud_storage_mysql
    restart: always
    env_file:
      - src/main/resources/application.properties
    ports:
      - "3306:3306"

  redis:
    image: redis:8.8
    container_name: cloud_storage_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cloud_storage_minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - src/main/resources/application.properties
    ports:
      - "9000:9000"
      - "9001:9001"