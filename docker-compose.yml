services:
  mysql:
    image: mysql:9.7
    container_name: cloud_storage_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_volume:/var/lib/mysql

  redis:
    image: redis:8.8
    container_name: cloud_storage_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cloud_storage_minio
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_volume:/data

volumes:
  mysql_volume:
  redis_volume:
  minio_volume: